name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Syntax check (compile all sources)
        run: python -m compileall -q dualled_pro.py controller_gl.py ps5led tests tools

      - name: Lint with ruff
        # Non-blocking style report; fails only on real syntax/undefined-name errors.
        run: |
          ruff check --select=E9,F63,F7,F82 --output-format=full .
          ruff check --exit-zero --statistics .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    # The suite uses the Windows mutex, PowerShell and ctypes HID code, so it runs on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The PyOpenGL pair is the optional 3D-preview pin from requirements.txt;
        # test_orbit imports controller_gl, which imports it at module level.
        run: python -m pip install --upgrade pip pytest PyOpenGL==3.1.10 pyopengltk==0.0.4

      - name: Run all test files
        run: python -m pytest tests -v
